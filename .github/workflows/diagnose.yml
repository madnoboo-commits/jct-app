name: 分岐の検出もれを調べる

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "範囲（南緯,西経,北緯,東経）"
        required: true
        default: "35.43,139.55,35.47,139.60"
      keyword:
        description: "注目する分岐名（空なら全件）"
        required: false
        default: "保土ヶ谷"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 判定理由を出力
        env:
          BBOX: ${{ inputs.bbox }}
          KEYWORD: ${{ inputs.keyword }}
        run: python scripts/jct_streetview.py --diagnose --bbox "$BBOX" --keyword "$KEYWORD"
