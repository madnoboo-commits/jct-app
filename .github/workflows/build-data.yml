name: 分岐データ生成

on:
  workflow_dispatch:
    inputs:
      region:
        description: "地域名（英数字。ファイル名になります）"
        required: true
        default: "hodogaya"
      bbox:
        description: "範囲（南緯,西経,北緯,東経）"
        required: true
        default: "35.40,139.50,35.50,139.65"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 計算ロジックのテスト
        run: python scripts/jct_streetview.py --test

      - name: 【一時】取りこぼしノードの接続先を調べる
        run: |
          python scripts/jct_streetview.py --probe \
            283016755,304036448,273331618,1802945739,980047475,273331636,746385817,5539265689
