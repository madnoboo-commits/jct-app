name: 分岐データ生成

on:
  workflow_dispatch:
    inputs:
      region:
        description: "地域名（英数字。ファイル名になります）"
        required: true
        default: "hodogaya"
      bbox:
        description: "範囲（南緯,西経,北緯,東経）"
        required: true
        default: "35.40,139.50,35.50,139.65"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 計算ロジックのテスト
        run: python scripts/jct_streetview.py --test

      - name: OpenStreetMap から分岐を取得
        env:
          REGION: ${{ inputs.region }}
          BBOX: ${{ inputs.bbox }}
          KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          ARGS=(--bbox "$BBOX" --region "$REGION" --outdir docs/data)
          if [ -n "$KEY" ]; then ARGS+=(--key "$KEY"); fi
          python scripts/jct_streetview.py "${ARGS[@]}"

      - name: 結果を保存
        env:
          REGION: ${{ inputs.region }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "分岐データ更新: $REGION"
          git push
