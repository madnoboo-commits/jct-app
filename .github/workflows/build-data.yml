name: 分岐データ生成

on:
  workflow_dispatch:
    inputs:
      region:
        description: "地域名（英数字。ファイル名になります）"
        required: true
        default: "hodogaya"
      bbox:
        description: "範囲（南緯,西経,北緯,東経）"
        required: true
        default: "35.40,139.50,35.50,139.65"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 計算ロジックのテスト
        run: python scripts/jct_streetview.py --test

      - name: 【一時】本線の種別を見分ける手がかりを探す
        run: |
          python scripts/jct_streetview.py --probe-ways \
            282460600,25798011,282460559,26321737,393025774,960288898,792949188
