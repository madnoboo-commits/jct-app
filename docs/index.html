<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分岐ビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sign:#0a6b3b; --on-sign:#ffffff; --ink:#23272a; --sub:#5d666b;
  --bg:#eceeec; --row:#ffffff; --line:#d5d9d6; --mark:#e8b10a;
  font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e7eae8;--sub:#a3aca8;--bg:#161a19;--row:#1f2423;--line:#333a38}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;background:var(--sign);color:var(--on-sign);
  padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top,0))}
h1{margin:0 0 10px;font-size:20px;font-weight:700;letter-spacing:.04em}
.controls{display:flex;gap:8px}
select,input{font:inherit;font-size:15px;padding:8px 10px;border-radius:6px;border:2px solid var(--on-sign);
  background:var(--sign);color:var(--on-sign);min-width:0}
input{flex:1}
input::placeholder{color:#cfe3d7}
main{max-width:720px;margin:0 auto;padding:12px}
.status{color:var(--sub);font-size:14px;margin:4px 4px 12px}
.row{background:var(--row);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;
  display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.plate{display:inline-block;background:var(--sign);color:var(--on-sign);border-radius:5px;
  padding:3px 10px;font-weight:700;font-size:15px;box-shadow:inset 0 0 0 2px var(--on-sign),0 0 0 1px var(--sign)}
.main{font-size:13px;color:var(--sub);margin-left:8px}
.dest{font-size:18px;font-weight:700;line-height:1.4}
.dest small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns a{flex:1 1 30%;text-align:center;text-decoration:none;color:var(--ink);font-size:14px;
  border:1.5px solid var(--line);border-radius:8px;padding:9px 6px;line-height:1.3}
.btns a.sv{border-color:var(--sign)}
.btns a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.btns a span{display:block;font-size:11px;color:var(--sub)}
footer{font-size:12px;color:var(--sub);text-align:center;padding:20px 12px 28px;line-height:1.7}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <h1>分岐ビュー</h1>
  <div class="controls">
    <select id="region" aria-label="地域"></select>
    <input id="q" type="search" placeholder="新保土ヶ谷、横浜新道" aria-label="名前で絞り込み">
  </div>
</header>
<main>
  <p class="status" id="status">読み込んでいます…</p>
  <div id="list"></div>
</main>
<footer>
  走行前の予習用です。運転中は操作しないでください。<br>
  道路データ © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>（ODbL）
</footer>
<script>
const $ = id => document.getElementById(id);
let rows = [];

function esc(s){return String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const q = $("q").value.trim();
  const hit = rows.filter(r => !q || [r.junction,r.mainline,r.destination].join(" ").includes(q));
  $("status").textContent = `${hit.length} か所の分岐`;
  $("list").innerHTML = hit.map(r => {
    const views = [...r.views].sort((a,b)=>b.distance_m-a.distance_m).map(v =>
      `<a class="sv" href="${esc(v.url)}" target="_blank" rel="noopener">${v.distance_m}m手前<span>${
         v.pano_date ? esc(v.pano_date)+" 撮影" : v.picked ? "看板位置から選択" : "ストリートビュー"}</span></a>`).join("");
    const map = `https://www.google.com/maps/search/?api=1&query=${r.lat},${r.lng}`;
    return `<article class="row">
      <div><span class="plate">${esc(r.junction || "名称なし")}</span><span class="main">${esc(r.mainline)}</span></div>
      <div class="dest">${esc((r.destination || "行き先データなし").replaceAll(";"," ・ "))}<small>この分岐から分かれる方面</small></div>
      <div class="btns">${views}<a href="${map}" target="_blank" rel="noopener">分岐点<span>地図で見る</span></a></div>
    </article>`;
  }).join("");
}

async function loadRegion(id){
  $("status").textContent = "読み込んでいます…";
  try{
    rows = await (await fetch(`data/${encodeURIComponent(id)}.json`)).json();
    render();
  }catch(e){
    rows = []; $("list").innerHTML = "";
    $("status").textContent = "データを読み込めませんでした。Actions で分岐データ生成を実行してください。";
  }
}

(async () => {
  try{
    const regs = await (await fetch("data/regions.json")).json();
    if(!regs.length) throw 0;
    $("region").innerHTML = regs.map(r => `<option value="${esc(r.id)}">${esc(r.id)}（${r.count}）</option>`).join("");
    $("region").onchange = e => loadRegion(e.target.value);
    $("q").oninput = render;
    loadRegion(regs[0].id);
  }catch(e){
    $("status").textContent = "地域データがまだありません。Actions で分岐データ生成を実行してください。";
  }
})();
</script>
</body>
</html>
